<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <!-- Apple touch icon : fond plein opaque (pas de transparence — iOS n'en
       accepte pas et arrondit lui-meme les coins). Pictogramme escalier
       48x36 x scale 2.5 -> 120x90, centre en (90,90), padding 30 partout. -->
  <rect width="180" height="180" fill="#152238"/>

  <g transform="translate(90 90) scale(2.5) translate(-24 -18)">
    <rect x="0" y="2" width="48" height="9" rx="1.5" fill="#D3714D"/>
    <rect x="13" y="14" width="35" height="9" rx="1.5" fill="#D3714D"/>
    <rect x="26" y="26" width="22" height="9" rx="1.5" fill="#D3714D"/>
  </g>
</svg>