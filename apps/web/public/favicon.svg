<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Icone favicon Immo Les Terrasses : pictogramme escalier (identique au
       composant Brand.tsx TerraceIcon), fond ink plein, 3 barres terracotta.
       Concu pour rester lisible en 16-32px : pas de detail superflu. -->
  <rect width="512" height="512" fill="#152238"/>

  <!-- 48x36 (logos) centres dans le carre : largeur utile 340, hauteur 255 -->
  <g transform="translate(256 256) scale(7.08333) translate(-24 -18)">
    <rect x="0" y="2" width="48" height="9" rx="1.5" fill="#D3714D"/>
    <rect x="13" y="14" width="35" height="9" rx="1.5" fill="#D3714D"/>
    <rect x="26" y="26" width="22" height="9" rx="1.5" fill="#D3714D"/>
  </g>
</svg>