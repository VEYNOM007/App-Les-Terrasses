<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Icone PWA purpose "maskable" : le fond ink remplit TOUTE la vue (une
       partie est rognee en cercle/squircle selon le launcher), le pictogramme
       doit tenir dans le cercle de diametre 80 % (rayon 204.8 sur 512).
       Picto 48x36 x scale 6.66667 -> largeur 320, hauteur 240, centre en 256.
       Coin le plus eloigne (extreme bas-droit, r ~196) < 204.8 : aucune
       rognure sur les launchers les plus agressifs. -->
  <rect width="512" height="512" fill="#152238"/>

  <g transform="translate(256 256) scale(6.66667) translate(-24 -18)">
    <rect x="0" y="2" width="48" height="9" rx="1.5" fill="#D3714D"/>
    <rect x="13" y="14" width="35" height="9" rx="1.5" fill="#D3714D"/>
    <rect x="26" y="26" width="22" height="9" rx="1.5" fill="#D3714D"/>
  </g>
</svg>