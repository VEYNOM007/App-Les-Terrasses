# ==========================================================
# Résidence Catalog — server blocks Nginx de référence
#
# Ce fichier est installé sur le VPS sous :
#   /etc/nginx/sites-available/immo-les-terrasse.conf
#   + symlink dans /etc/nginx/sites-enabled/
#
# Il ne contient QUE les blocs port 80 : `certbot --nginx`
# ajoute automatiquement la partie 443 + le redirect HTTPS
# (pattern identique au vhost compta-ia-app.fr existant).
# NE JAMAIS modifier les autres vhosts du VPS partagé.
#
# Prérequis avant certbot : DNS A des noms ci-dessous vers le
# VPS. Vérification : dig +short <nom> -> 169.58.53.64
#
# Proxy vers les conteneurs publiés sur 127.0.0.1 uniquement :
#   web -> 127.0.0.1:3002 (port hôte 3000 = ComptaAI, à ne pas toucher)
#   api -> 127.0.0.1:3001
# ==========================================================

# --- Frontend web ---
server {
    listen 80;
    server_name immo-les-terrasse.com www.immo-les-terrasse.com;

    server_tokens off;                 # équiv. -Server de Caddy
    client_max_body_size 6m;           # uploads KYC (≤ 5 Mo) : anticipe le multipart

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- API ---
server {
    listen 80;
    server_name api.immo-les-terrasse.com;

    # Pas d'add_header de sécurité ici : helmet() (apps/api/src/main.ts)
    # fournit déjà HSTS, nosniff et Referrer-Policy sur les réponses API.
    server_tokens off; # équiv. -Server de Caddy (helmet n'y touche pas)
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
