packages:
  - "apps/*"
  - "packages/*"

# pnpm >= 10 ne déploie que des workspace packages "injectés" (copies
# matérielles dans node_modules du package cible). Sans cette option,
# `pnpm --filter <pkg> deploy --prod` (utilisé dans apps/api/Dockerfile)
# échoue avec ERR_PNPM_DEPLOY_NONINJECTED_WORKSPACE. Le flag --legacy est
# un contournement voué à disparaître : l'injection est le mode natif.
# NB : clé en camelCase (comme minimumReleaseAge/allowBuilds ci-dessous) —
# en kebab-case pnpm ne la lit pas (config get → undefined).
injectWorkspacePackages: true

# Sécurité chaîne d'approvisionnement (pnpm >= 10).
# 1) minimumReleaseAge : bloque l'installation de toute version publiée
#    depuis moins de 7 jours (fenêtre de détection/retrait des paquets
#    malveillants). Strict = échec de résolution, jamais de repli silencieux.
minimumReleaseAge: 10080 # 7 jours en minutes
minimumReleaseAgeStrict: true

# Vite 7 accepte esbuild 0.27.x ou 0.28.x. La version 0.28.2 du lockfile
# n'a pas encore atteint le délai de maturité minimal ; on reste sur la
# dernière branche mature compatible, sans exception au garde-fou.
overrides:
  esbuild: 0.27.2

# 2) allowBuilds : seuls les paquets listés ici peuvent exécuter leurs
#    scripts de build (postinstall/install/preinstall). Tout autre paquet
#    est bloqué par défaut (strictDepBuilds=true → install en erreur).
#    Whitelist minimale vérifiée — jamais "dangerouslyAllowAllBuilds".
allowBuilds:
  bcrypt: true            # compilation native (authentification)
  esbuild: true           # binaire de plateforme (vitest / Next)
  msgpackr-extract: true  # addon natif optionnel (msgpackr)
  prisma: true            # preinstall du CLI Prisma
  '@prisma/client': true  # postinstall = prisma generate (obligatoire)
  '@prisma/engines': true # postinstall = téléchargement des engines Prisma
  '@nestjs/core': false   # postinstall OpenCollective (opencollective || exit 0) : télémétrie inutile, refusé explicitement
